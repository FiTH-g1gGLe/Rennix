<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rennix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Icon set: one line style throughout -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="var(--accent)" stroke="none"></rect><path d="M38 90V30h24a18 18 0 0 1 0 36H38" fill="none" stroke="var(--accent-ink)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path><path d="M56 66l24 24M82 74v16H66" fill="none" stroke="var(--accent-ink)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  <symbol id="i-x-mark" viewBox="0 0 120 120"><path d="M20 100L100 20M70 20h30v30" fill="none" stroke="var(--accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"></path><path d="M20 20l30 30M70 70l30 30M100 70v30H70" fill="none" stroke="var(--text)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  <symbol id="i-auto" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"></path></symbol>
  <symbol id="i-tv" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="13" rx="2"></rect><path d="M17 2l-5 5-5-5"></path></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5M12 7v5l3 2"></path></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"></path></symbol>
  <symbol id="i-check-c" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></symbol>
  <symbol id="i-x-c" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></symbol>
  <symbol id="i-disk" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></symbol>
  <symbol id="i-csv" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></symbol>
  <symbol id="i-bug" viewBox="0 0 24 24"><rect x="7" y="6" width="10" height="14" rx="5"></rect><path d="M12 6V3M9 4l1 2M15 4l-1 2M7 11H3M21 11h-4M7 16H4M20 16h-3M12 10v10"></path></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="9" rx="1.5"></rect><rect x="3" y="15" width="7" height="6" rx="1.5"></rect><rect x="14" y="15" width="7" height="6" rx="1.5"></rect></symbol>
  <symbol id="i-tree" viewBox="0 0 24 24"><path d="M3 5h6l2 2h10v4H3zM7 11v8h4M7 15h4"></path><rect x="11" y="13" width="10" height="4" rx="1"></rect><rect x="11" y="17" width="10" height="4" rx="1"></rect></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"></path><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <svg width="32" height="32" role="img" aria-label="Rennix"><use href="#i-logo"></use></svg>
    <div class="wordmark" aria-hidden="true">renni<svg width="15" height="15"><use href="#i-x-mark"></use></svg></div>
  </div>
  <div class="seg" id="mode" role="group" aria-label="What are you renaming?">
    <button data-mode="auto" data-tip="✨ Auto|Rennix works out whether each file is a film or an episode."><svg class="ic"><use href="#i-auto"></use></svg>Auto</button>
    <button data-mode="movie" data-tip="🎬 Movies|Treat every file as a film."><svg class="ic"><use href="#i-film"></use></svg>Movies</button>
    <button data-mode="tv" data-tip="📺 TV Shows|Treat every file as a TV episode."><svg class="ic"><use href="#i-tv"></use></svg>TV Shows</button>
  </div>
  <div class="top-actions">
    <button class="icon-btn hidden" id="btn-console" aria-label="Console" data-tip="🐞 Console|Everything Rennix is doing, with error codes.|Ctrl + Shift + L · Copy the report and send it to get help."><svg class="ic lg"><use href="#i-bug"></use></svg><span class="badge hidden" id="console-badge"></span></button>
    <button class="icon-btn" id="btn-history" aria-label="Rename history" data-tip="🕘 History|Every past rename, with Undo."><svg class="ic lg"><use href="#i-history"></use></svg></button>
    <button class="icon-btn" id="btn-format" aria-label="Naming formats" data-tip="🏷️ Naming formats|Pick a template or build your own."><svg class="ic lg"><use href="#i-tag"></use></svg></button>
    <button class="icon-btn" id="btn-settings" aria-label="Settings" data-tip="⚙️ Settings|Library folders, matching, safety and more."><svg class="ic lg"><use href="#i-gear"></use></svg></button>
  </div>
</header>

<div id="banners"></div>

<!-- First launch / empty -->
<section class="start" id="screen-start">
  <div class="start-inner">
    <div class="dropzone" id="dropzone">
      <div class="dz-icon"><svg class="ic xl"><use href="#i-upload"></use></svg></div>
      <h1>Drop your movies or TV shows here</h1>
      <p>Files or whole folders. Nothing gets renamed until you've checked the preview.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px">
        <button class="btn primary" id="btn-choose-folder" data-tip="📁 Choose a folder|Rennix finds every video inside, including subfolders, and skips samples and junk.|🛡️ Nothing changes until you press Rename."><svg class="ic"><use href="#i-folder"></use></svg>Choose folder</button>
        <button class="btn" id="btn-choose-files" data-tip="📄 Choose files|Pick one or more video files."><svg class="ic"><use href="#i-file"></use></svg>Choose files</button>
      </div>
    </div>
    <div class="steps">
      <div class="step"><b><svg class="ic"><use href="#i-upload"></use></svg>1 · Drop</b><span>Add files or folders</span></div>
      <div class="step"><b><svg class="ic"><use href="#i-eye"></use></svg>2 · Check</b><span>Look over the new names</span></div>
      <div class="step"><b><svg class="ic"><use href="#i-pencil"></use></svg>3 · Rename</b><span>One click, and it can be undone</span></div>
    </div>
    <div class="start-foot">
      <span id="start-stats"></span>
      <button class="link" id="link-history"><svg class="ic"><use href="#i-history"></use></svg>View rename history</button>
    </div>
  </div>
</section>

<!-- Preview and rename -->
<section class="main hidden" id="screen-main">
  <div class="list-col">
    <div class="dropbar" id="dropbar">
      <span style="display:inline-flex;gap:10px;align-items:center"><svg class="ic"><use href="#i-plus"></use></svg>Drop more files or folders here</span>
      <span style="display:flex;gap:8px">
        <button class="btn small" id="btn-add-folder"><svg class="ic"><use href="#i-folder"></use></svg>Add folder</button>
        <button class="btn small" id="btn-add-files"><svg class="ic"><use href="#i-file"></use></svg>Add files</button>
      </span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="table-wrap">
      <div class="table" role="table" aria-label="Files to rename">
        <div class="thead" role="row"><div>Status</div><div>Current name</div><div></div><div>New name</div><div>Matched to</div></div>
        <div id="rows"></div>
      </div>
      <div class="altview hidden" id="altview"></div>
    </div>
    <div class="footer">
      <div class="left">
        <span id="count" style="display:inline-flex;gap:6px;align-items:center"><svg class="ic"><use href="#i-file"></use></svg><span></span></span>
        <label data-tip="🏷️ Naming style|How films are named. Change templates or build your own with the tag button at the top."><svg class="ic"><use href="#i-tag"></use></svg>Films <select id="sel-movie-format"></select></label>
        <label data-tip="🏷️ Naming style|How TV episodes are named."><svg class="ic"><use href="#i-tag"></use></svg>TV <select id="sel-episode-format"></select></label>
        <label class="check" data-tip="⚠️ Include amber files|Also rename files Rennix wasn't sure about. Check them first!"><input type="checkbox" id="chk-amber">Include amber</label>
        <button class="btn meta-btn" id="btn-meta"><span>Metadata</span></button>
      </div>
      <div class="right">
        <button class="btn" id="btn-export" data-tip="📋 Export plan|Save the preview as a spreadsheet (CSV) before renaming."><svg class="ic"><use href="#i-csv"></use></svg>Export</button>
        <button class="btn" id="btn-clear" data-tip="🧹 Clear the list|Removes the files from this list. Nothing on disk changes."><svg class="ic"><use href="#i-trash"></use></svg>Clear</button>
        <button class="btn primary" id="btn-rename"><svg class="ic"><use href="#i-pencil"></use></svg><span>Rename</span></button>
      </div>
    </div>
  </div>
  <aside class="side hidden" id="side" aria-label="Match details"></aside>
</section>

<section class="console hidden" id="console" aria-label="Console"></section>
<div id="modal-root"></div>
<div id="tip" role="tooltip"></div>
<div id="hovercard" aria-hidden="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
