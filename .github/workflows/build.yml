name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests platformdirs guessit rapidfuzz send2trash mutagen pytest
      - name: Install video tools (for the real-file metadata tests)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg mkvtoolnix
          elif [ "$RUNNER_OS" == "macOS" ]; then brew install ffmpeg mkvtoolnix
          else choco install ffmpeg -y --no-progress; fi
      - name: Get mkvpropedit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/get-mkvpropedit.ps1
      - name: Check the tools are found
        run: python -c "from rennix import embed; import shutil; print('mkvpropedit:', embed.find_mkvpropedit()); print('mutagen:', embed.have_mutagen()); print('ffmpeg:', shutil.which('ffmpeg'))"
      - name: Run tests
        run: python -m pytest -q

  build-windows:
    name: Build Windows app
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Get mkvpropedit (shipped for writing MKV tags)
        shell: pwsh
        run: ./installer/get-mkvpropedit.ps1
      - name: Bundle the TheMovieDB token (from the repo secret, never committed)
        shell: python
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          import os
          tok = os.environ.get("TMDB_READ_TOKEN", "").strip()
          with open("rennix/_bundled.py", "w", encoding="utf-8") as fh:
              fh.write(f"TMDB_READ_TOKEN = {tok!r}\n")
          print("Token bundled" if tok else "No TMDB_READ_TOKEN secret set: users will be asked for a key")
      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import rennix; print(rennix.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name Rennix
          --icon assets/rennix.ico
          --add-data "rennix/ui;rennix/ui"
          --collect-data guessit --collect-data babelfish --collect-data rebulk
          --collect-binaries pymediainfo
          --add-binary "tools/mkvpropedit.exe;tools"
          --add-data "tools/MKVToolNix-NOTICE.txt;tools"
          --hidden-import mutagen.mp4
          --hidden-import rennix._bundled
          run_rennix.py
      - name: Check the build
        shell: pwsh
        run: |
          if (!(Test-Path dist/Rennix/Rennix.exe)) { throw "Rennix.exe missing" }
          if (!(Test-Path dist/Rennix/_internal/rennix/ui/index.html)) { throw "UI files missing" }
          & dist/Rennix/_internal/tools/mkvpropedit.exe --version
          if ($LASTEXITCODE -ne 0) { throw "bundled mkvpropedit doesn't run" }
      - name: Open the app (smoke test)
        run: python scripts/smoke.py dist/Rennix/Rennix.exe
      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/Rennix dist/Rennix-Portable
          Set-Content dist/Rennix-Portable/portable.txt "Rennix keeps its settings in the data folder next to it."
          Compress-Archive -Path dist/Rennix-Portable/* -DestinationPath "dist/Rennix-${{ steps.ver.outputs.version }}-Windows-Portable.zip"
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\rennix.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Rennix-Setup-*.exe
            dist/Rennix-*-Windows-Portable.zip

  build-macos:
    name: Build Mac app (preview)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow
      - name: Bundle the TheMovieDB token
        shell: python
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          import os
          tok = os.environ.get("TMDB_READ_TOKEN", "").strip()
          with open("rennix/_bundled.py", "w", encoding="utf-8") as fh:
              fh.write(f"TMDB_READ_TOKEN = {tok!r}\n")
      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name Rennix
          --icon assets/rennix.png
          --osx-bundle-identifier io.github.fith-g1ggle.rennix
          --add-data "rennix/ui:rennix/ui"
          --collect-data guessit --collect-data babelfish --collect-data rebulk
          --collect-binaries pymediainfo
          --hidden-import mutagen.mp4
          --hidden-import rennix._bundled
          run_rennix.py
      - name: Open the app (smoke test)
        run: python scripts/smoke.py dist/Rennix.app/Contents/MacOS/Rennix
      - name: Disk image
        run: |
          V="$(python -c 'import rennix; print(rennix.__version__)')"
          mkdir -p dmg && cp -R dist/Rennix.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Rennix" -srcfolder dmg -ov -format UDZO "dist/Rennix-$V-macOS-AppleSilicon.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Rennix-*-macOS-*.dmg

  build-linux:
    name: Build Linux app (preview)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for the window
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libegl1 libgl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgbm1 libasound2 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt qtpy PyQt6 PyQt6-WebEngine
      - name: Bundle the TheMovieDB token
        shell: python
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          import os
          tok = os.environ.get("TMDB_READ_TOKEN", "").strip()
          with open("rennix/_bundled.py", "w", encoding="utf-8") as fh:
              fh.write(f"TMDB_READ_TOKEN = {tok!r}\n")
      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name Rennix
          --add-data "rennix/ui:rennix/ui"
          --collect-data guessit --collect-data babelfish --collect-data rebulk
          --collect-binaries pymediainfo
          --hidden-import mutagen.mp4
          --hidden-import rennix._bundled
          --hidden-import webview.platforms.qt --hidden-import qtpy
          --exclude-module gi --exclude-module tkinter
          run_rennix.py
      - name: Open the app (smoke test)
        run: xvfb-run -a python scripts/smoke.py dist/Rennix/Rennix
      - name: AppImage
        run: |
          V="$(python -c 'import rennix; print(rennix.__version__)')"
          mkdir -p AppDir/usr/bin
          cp -r dist/Rennix/* AppDir/usr/bin/
          cp assets/rennix.png AppDir/rennix.png
          printf '[Desktop Entry]\nType=Application\nName=Rennix\nComment=Rename and organise your movies and TV shows\nExec=Rennix\nIcon=rennix\nCategories=AudioVideo;Utility;\nTerminal=false\n' > AppDir/rennix.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/Rennix" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/Rennix-$V-Linux-x86_64.AppImage"
      - name: Open the AppImage (smoke test)
        run: APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python scripts/smoke.py dist/Rennix-*-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Rennix-*-Linux-*.AppImage

  release:
    name: Publish release
    needs: [build-windows, build-macos, build-linux]
    # Windows must build; Mac and Linux previews are added when they built too
    if: always() && needs.build-windows.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish this version as a release (once per version, so download counts stick)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.build-windows.outputs.version }}"
          ls -la dist
          python scripts/release_notes.py dist/notes
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists; this build is in the Actions artifacts. Bump the version to publish a new release."
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "Rennix $V" --notes-file "dist/notes/$V.md" \
              $(ls dist/Rennix-* 2>/dev/null)
          fi
          for f in dist/notes/*.md; do
            v="$(basename "$f" .md)"
            if gh release view "v$v" >/dev/null 2>&1; then gh release edit "v$v" --notes-file "$f" >/dev/null && echo "notes updated: v$v"; fi
          done
